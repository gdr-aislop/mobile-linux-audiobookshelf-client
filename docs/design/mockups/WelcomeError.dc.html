<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  :root{
    --bg:#fafafa; --headerbar:#fafafa; --card:#ffffff; --fg:#2e3436; --fg-dim:#77767b;
    --accent:#3584e4; --divider:rgba(0,0,0,.09); --shade:rgba(0,0,0,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#3d3846;}
  .phone{width:390px;height:844px;background:var(--bg);font-family:Cantarell,-apple-system,"Segoe UI",system-ui,sans-serif;
    color:var(--fg);display:flex;flex-direction:column;overflow:hidden;position:relative;}
  .headerbar{height:47px;min-height:47px;background:var(--headerbar);border-bottom:1px solid var(--divider);flex:0 0 auto;}
  .content{flex:1;overflow-y:auto;padding:28px 22px 24px;}
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .app-icon{width:60px;height:60px;border-radius:17px;background:linear-gradient(160deg,#1a5fb4,#3584e4);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(26,95,180,.35);}
  .title{margin-top:14px;font-size:19px;font-weight:800;}
  .subtitle{margin-top:6px;font-size:13px;color:var(--fg-dim);line-height:1.5;max-width:280px;}

  .seg{display:flex;background:#eeeeef;border-radius:10px;padding:2px;margin:22px 0 16px;align-self:stretch;}
  .seg-opt{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--fg-dim);}
  .seg-opt.active{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15);}

  .banner{width:100%;background:#fdecea;border:1px solid #f4b9b2;border-radius:10px;padding:11px 13px;
    display:flex;align-items:flex-start;gap:9px;margin-bottom:16px;}
  .banner svg{flex:0 0 auto;margin-top:1px;color:#c01c28;}
  .banner-text{font-size:12.5px;color:#8c1a1a;line-height:1.45;}

  .field-card{width:100%;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--divider);}
  .field-card.error{border-color:#e57373;}
  .field{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:9px 14px;border-bottom:1px solid var(--divider);
    min-height:52px;position:relative;}
  .field:last-child{border-bottom:none;}
  .field-label{font-size:11px;font-weight:600;color:var(--fg-dim);}
  .field-label.error{color:#c01c28;}
  .field-value{font-size:14px;color:var(--fg);}
  .field-suffix{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--fg-dim);}

  .connect-btn{width:100%;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:14.5px;font-weight:700;margin-top:22px;}
  .connect-btn.enabled{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(53,132,228,.35);}
</style>
</helmet>

<div class="phone">
  <div class="headerbar"></div>
  <div class="content">
    <div class="hero">
      <div class="app-icon">
        <svg width="28" height="28" viewBox="0 0 34 34" fill="none">
          <path d="M17 5c-6.6 0-12 5.4-12 12v7.5a2.5 2.5 0 002.5 2.5H9a2 2 0 002-2v-6a2 2 0 00-2-2H7v-1a10 10 0 0120 0v1h-2a2 2 0 00-2 2v6a2 2 0 002 2h1.5a2.5 2.5 0 002.5-2.5V17c0-6.6-5.4-12-12-12z" fill="#fff"/>
        </svg>
      </div>
      <div class="title">Connect to your Audiobookshelf server</div>
      <div class="subtitle">Enter your server address and sign in to start listening.</div>
    </div>

    <div class="seg">
      <div class="seg-opt active">Password</div>
      <div class="seg-opt">API Token</div>
    </div>

    <div class="banner">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.7" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".9" fill="currentColor"/></svg>
      <div class="banner-text">Unable to sign in — check your username and password and try again.</div>
    </div>

    <div class="field-card">
      <div class="field">
        <div class="field-label">Server URL</div>
        <div class="field-value">https://library.homeserver.dev</div>
      </div>
      <div class="field">
        <div class="field-label">Username</div>
        <div class="field-value">jane.reyes</div>
      </div>
      <div class="field">
        <div class="field-label error">Password</div>
        <div class="field-value">••••••••••</div>
        <div class="field-suffix">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M1.5 9S4.5 3.5 9 3.5 16.5 9 16.5 9 13.5 14.5 9 14.5 1.5 9 1.5 9z" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="9" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
        </div>
      </div>
    </div>

    <div class="connect-btn enabled">Connect</div>
  </div>
</div>
</x-dc>
</body>
</html>
